# Compila y prueba la solución con el SDK de global.json y valida los enlaces Markdown.
name: ci

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Las pruebas aún asumen rutas de Windows: Linux informa pero no bloquea (G6-US-04).
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore src/MoralesLarios.OOFP.sln

      - name: Compilar (Release, sin incremental)
        run: dotnet build src/MoralesLarios.OOFP.sln -c Release --no-incremental --no-restore -v q

      - name: Compilar las herramientas MlDoc y MlRename
        run: |
          dotnet build src/scripts/tools/MlDoc/MlDoc.csproj -c Release -v q
          dotnet build src/scripts/tools/MlRename/MlRename.csproj -c Release -v q

      - name: Pruebas
        run: dotnet test src/MoralesLarios.OOFP.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Subir resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  markdown:
    name: enlaces y anclas Markdown
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enlaces rotos
        shell: powershell
        run: |
          $salida = powershell -NoProfile -ExecutionPolicy Bypass -File src/scripts/check-md-links2.ps1
          $salida | Select-Object -Last 20
          if (-not ($salida | Select-String -Pattern 'rotos = 0\s*$' -Quiet)) { exit 1 }

      - name: Anclas rotas
        shell: powershell
        run: |
          $salida = powershell -NoProfile -ExecutionPolicy Bypass -File src/scripts/check-md-anchors4.ps1
          $salida | Select-Object -Last 20
          if (-not ($salida | Select-String -Pattern 'rotos = 0\s*$' -Quiet)) { exit 1 }
